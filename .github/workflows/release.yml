name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: 배포
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os

          key = os.environ.get("SIGNING_KEY", "").strip()
          print("signing_key_length", len(key))
          print("signing_key_newlines", key.count("\n"))
          print("signing_key_literal_backslash_n", key.count("\\n"))
          print("signing_key_has_begin", key.startswith("-----BEGIN PGP PRIVATE KEY BLOCK-----"))
          print("signing_key_has_end", key.rstrip().endswith("-----END PGP PRIVATE KEY BLOCK-----"))
          print("signing_password_length", len(os.environ.get("SIGNING_PASSWORD", "")))
          if key.startswith("\"") and key.endswith("\""):
              key = key[1:-1]
          key = key.replace("\\n", "\n").replace("\r\n", "\n").strip() + "\n"
          with open(os.environ["RUNNER_TEMP"] + "/signing-key.asc", "w") as handle:
              handle.write(key)
          PY
          gpg --batch --import "$RUNNER_TEMP/signing-key.asc"
          gpg --list-packets "$RUNNER_TEMP/signing-key.asc" | awk '/:secret key packet:/ { print; exit }'
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
          test -n "$fingerprint"
          printf 'Pebble Forge signing probe\n' > "$RUNNER_TEMP/signing-probe.txt"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SIGNING_PASSWORD" \
            --local-user "$fingerprint" --armor --detach-sign \
            --output "$RUNNER_TEMP/signing-probe.asc" "$RUNNER_TEMP/signing-probe.txt"
          gpg --batch --verify "$RUNNER_TEMP/signing-probe.asc" "$RUNNER_TEMP/signing-probe.txt"
          {
            echo 'ORG_GRADLE_PROJECT_signingKey<<SIGNING_KEY_EOF'
            cat "$RUNNER_TEMP/signing-key.asc"
            echo 'SIGNING_KEY_EOF'
          } >> "$GITHUB_ENV"

      - name: Build and verify
        run: ./gradlew clean build javadoc --no-daemon

      - name: Publish to Maven Central
        run: ./gradlew nmcpCheckAggregationFiles publishAggregationToCentralPortal --no-daemon
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew :pebble-forge-gradle-plugin:publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Upload aggregation bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-aggregation
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: ignore
