name: Release deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Central Portal deployment ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-deployment-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: 배포
    steps:
      - name: Release Central deployment
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          status_url="https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"
          release_url="https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID"

          read_state() {
            curl -fsS -X POST -H "Authorization: Bearer $token" "$status_url"
          }

          status="$(read_state)"
          echo "$status" | jq '{deploymentId, deploymentState, errors}'
          state="$(printf '%s' "$status" | jq -r '.deploymentState')"

          if [ "$state" = "VALIDATED" ]; then
            if ! curl -fsS -X POST -H "Authorization: Bearer $token" "$release_url"; then
              echo "Publish request returned an error, checking the deployment state anyway."
            fi
            status="$(read_state)"
            state="$(printf '%s' "$status" | jq -r '.deploymentState')"
            echo "deployment_state=$state after publish request"
          fi

          if [ "$state" = "PUBLISHED" ]; then
            echo "Deployment is already published."
            exit 0
          fi
          if [ "$state" != "PUBLISHING" ]; then
            echo "$status" | jq '{deploymentId, deploymentState, errors}'
            echo "Deployment state [$state] cannot be released."
            exit 1
          fi

          for attempt in $(seq 1 180); do
            status="$(read_state)"
            state="$(printf '%s' "$status" | jq -r '.deploymentState')"
            echo "deployment_state=$state attempt=$attempt"
            if [ "$state" = "PUBLISHED" ]; then
              exit 0
            fi
            if [ "$state" = "FAILED" ]; then
              echo "$status" | jq '{deploymentId, deploymentState, errors}'
              exit 1
            fi
            sleep 10
          done
          echo "$status" | jq '{deploymentId, deploymentState, errors}'
          echo "Timed out waiting for PUBLISHED."
          exit 1
